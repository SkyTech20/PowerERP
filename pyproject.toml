# Code style and checks (run in CI, see .github/workflows/tests.yml):
#   ruff check .        lint (errors, unused imports, import order)
#   black --check .     formatting
#   mypy                types of the packages listed below (more as the modules move into powererp/)

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "migrations/versions"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines: black decides the formatting
    "B008",   # function calls in defaults (Flask / SQLAlchemy idioms)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E741"]
# Modules written before the reorganization: these rules are fixed as each one moves into powererp/modules (O2 to O5)
"tools/*" = ["E741", "E702", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["powererp", "db", "auth", "backup_api"]

[tool.mypy]
python_version = "3.10"
files = ["powererp/core", "powererp/container.py", "powererp/factory.py", "powererp/seed", "powererp/modules", "powererp/integrations"]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Modules written before the reorganization (checked once they move into powererp/modules)
module = ["auth", "backup_api", "db"]
ignore_errors = true
