<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PowerERP Demo</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="logged-out">
  <header class="topbar">
    <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    <a class="brand" href="#/">
      <span class="brand-logo">P</span>
      <span class="brand-text"><strong data-i18n="app.name"></strong><small data-i18n="app.tagline"></small></span>
    </a>
    <div class="topbar-spacer"></div>
    <label class="company">
      <span data-i18n="app.company"></span>
      <select id="companySelect" disabled><option>MA2</option></select>
    </label>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
    <div class="user">
      <a class="user-link" href="#/account" id="userLink"><span class="avatar" id="userAvatar"></span><span class="user-name" id="userName"></span></a>
      <button type="button" class="btn small logout-btn" id="logoutBtn" data-i18n="auth.logout"></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content">
      <div class="demo-banner" data-i18n="app.demoBanner"></div>
      <div id="view"></div>
    </main>
  </div>

  <div class="login-screen" id="login" hidden>
    <form class="login-card card" id="loginForm" novalidate>
      <div class="login-brand"><span class="brand-logo">P</span><span><strong data-i18n="app.name"></strong><small data-i18n="app.tagline"></small></span></div>
      <h1 data-i18n="auth.title"></h1>
      <div class="field"><label for="loginUser" data-i18n="auth.username"></label><input type="text" id="loginUser" autocomplete="username" autofocus></div>
      <div class="field"><label for="loginPass" data-i18n="auth.password"></label><input type="password" id="loginPass" autocomplete="current-password"></div>
      <div class="login-error" id="loginError" hidden></div>
      <button type="submit" class="btn primary login-submit" data-i18n="auth.signIn"></button>
      <div class="lang-switch login-lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </form>
  </div>

  <div class="toast-host" id="toasts"></div>

  <script src="assets/i18n.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
