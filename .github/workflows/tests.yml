name: Tests

on:
  push:
    branches: [main, Demo]
  pull_request:
    branches: [main, Demo]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: powererp
          POSTGRES_PASSWORD: powererp
          POSTGRES_DB: powererp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U powererp -d powererp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://powererp:powererp@localhost:5432/powererp_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and formatting
        run: |
          ruff check .
          black --check .
          mypy

      # tests/conftest.py empties the PostgreSQL test database, migrates it and starts the ERP with the demo dataset.
      - name: Run tests
        run: python -m pytest -q --cov=powererp --cov-report=term
