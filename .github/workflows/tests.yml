name: Tests

on:
  push:
    branches: [main, Demo]
  pull_request:
    branches: [main, Demo]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # tests/conftest.py starts the ERP on a temporary SQLite file with the demo dataset.
      - name: Run tests
        run: python -m pytest -q
